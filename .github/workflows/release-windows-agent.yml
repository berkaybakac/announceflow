name: Release Windows Agent

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r agent/requirements-agent.txt

      - name: Stamp agent version
        shell: pwsh
        run: |
          $sha = "${{ github.sha }}".Substring(0, 7)
          $ver = "${{ github.ref_name }}-$sha"
          Set-Content -Path agent/_version.py -Value "AGENT_VERSION = `"$ver`"" -Encoding utf8
          Get-Content agent/_version.py

      - name: Build EXE
        working-directory: agent
        run: |
          python build_agent.py

      - name: Smoke test - EXE exists
        working-directory: agent
        run: |
          $exe = "dist\StatekSound.exe"
          if (!(Test-Path $exe)) {
            Write-Error "EXE not found at $exe"
            exit 1
          }
          Write-Host "PASS: EXE built successfully"
        shell: pwsh

      - name: Smoke test - EXE self-test
        working-directory: agent
        shell: pwsh
        timeout-minutes: 5
        run: |
          $out = Join-Path (Get-Location) "selftest.txt"
          $p = Start-Process -FilePath "dist\StatekSound.exe" -ArgumentList @("--self-test", "`"$out`"") -Wait -PassThru
          if (!(Test-Path $out)) {
            Write-Error "Self-test wrote no report (exit $($p.ExitCode))"
            exit 1
          }
          Get-Content $out
          if (-not (Select-String -Path $out -Pattern "^RESULT=PASS$" -Quiet)) {
            Write-Error "Self-test failed (exit $($p.ExitCode))"
            exit 1
          }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: StatekSound-${{ github.ref_name }}
          path: agent/dist/StatekSound.exe

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: agent/dist/StatekSound.exe
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
